<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background: {{ colors.primary }};
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: {{ colors.text_light }};
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px;
  }
  .day-badge {
    background: {{ colors.highlight }};
    color: {{ colors.text_light }};
    font-size: 72px;
    font-weight: 800;
    padding: 20px 50px;
    border-radius: 16px;
    margin-bottom: 40px;
    letter-spacing: 2px;
  }
  .topic {
    font-size: 48px;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
    margin-bottom: 30px;
    max-width: 900px;
  }
  .track {
    font-size: 28px;
    color: {{ colors.highlight }};
    text-transform: uppercase;
    letter-spacing: 4px;
    margin-bottom: 30px;
    font-weight: 600;
  }
  .takeaway {
    font-size: 26px;
    color: #b0b0b0;
    text-align: center;
    max-width: 800px;
    line-height: 1.5;
    font-style: italic;
  }
  .date {
    position: absolute;
    bottom: 30px;
    right: 40px;
    font-size: 20px;
    color: #666;
  }
  .brand {
    position: absolute;
    bottom: 30px;
    left: 40px;
    font-size: 20px;
    color: #666;
  }
</style>
</head>
<body>
  <div class="day-badge">DAY {{ day_number }}</div>
  <div class="topic">{{ topic }}</div>
  {% if track %}<div class="track">{{ track }}</div>{% endif %}
  {% if key_takeaway %}<div class="takeaway">"{{ key_takeaway }}"</div>{% endif %}
  {% if date %}<div class="date">{{ date }}</div>{% endif %}
  <div class="brand">Security Learning Journey</div>
</body>
</html>
