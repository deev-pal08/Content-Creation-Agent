<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: {{ colors.text_light }};
    position: relative;
    overflow: hidden;
  }
  .bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    {% if bg_image_uri %}
    background-image: url('{{ bg_image_uri }}');
    background-size: cover;
    background-position: center;
    {% else %}
    background: {{ colors.primary }};
    {% endif %}
  }
  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    {% if bg_image_uri %}
    background: linear-gradient(
      to bottom,
      rgba(26, 26, 46, 0.3) 0%,
      rgba(26, 26, 46, 0.6) 40%,
      rgba(26, 26, 46, 0.85) 70%,
      rgba(26, 26, 46, 0.95) 100%
    );
    {% endif %}
  }
  .content {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 60px;
  }
  .day-badge {
    background: {{ colors.highlight }};
    color: {{ colors.text_light }};
    font-size: 48px;
    font-weight: 800;
    padding: 12px 36px;
    border-radius: 12px;
    letter-spacing: 2px;
    display: inline-block;
    align-self: flex-start;
    margin-bottom: 24px;
  }
  .topic {
    font-size: 52px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 20px;
    max-width: 900px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .track {
    font-size: 22px;
    color: {{ colors.highlight }};
    text-transform: uppercase;
    letter-spacing: 4px;
    margin-bottom: 20px;
    font-weight: 600;
  }
  .takeaway {
    font-size: 24px;
    color: #d0d0d0;
    max-width: 800px;
    line-height: 1.5;
    font-style: italic;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .bottom-bar {
    position: absolute;
    bottom: 24px;
    left: 60px;
    right: 60px;
    display: flex;
    justify-content: space-between;
    z-index: 1;
  }
  .date {
    font-size: 18px;
    color: #999;
  }
  .brand {
    font-size: 18px;
    color: #999;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="day-badge">DAY {{ day_number }}</div>
    <div class="topic">{{ topic }}</div>
    {% if track %}<div class="track">{{ track }}</div>{% endif %}
    {% if key_takeaway %}<div class="takeaway">"{{ key_takeaway }}"</div>{% endif %}
  </div>
  <div class="bottom-bar">
    <div class="brand">Security Learning Journey</div>
    {% if date %}<div class="date">{{ date }}</div>{% endif %}
  </div>
</body>
</html>
