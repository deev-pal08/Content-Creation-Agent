<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    min-height: 1080px;
    background: #000000;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #ffffff;
    display: flex;
    flex-direction: column;
  }

  /* ── Profile header (Twitter-style) ── */
  .profile {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 52px 64px 0;
    margin-bottom: 48px;
  }
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .name-block {
    display: flex;
    flex-direction: column;
  }
  .display-name {
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .verified {
    width: 20px;
    height: 20px;
    background: #1d9bf0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #fff;
  }
  .username {
    font-size: 17px;
    color: #71767b;
    margin-top: 2px;
  }

  /* ── Main content ── */
  .main-content {
    flex-grow: 1;
    padding: 0 64px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .headline {
    font-size: 48px;
    font-weight: 800;
    line-height: 1.25;
    color: #ffffff;
    margin-bottom: 36px;
    max-width: 920px;
  }

  .explanation {
    font-size: 30px;
    line-height: 1.55;
    color: #e7e9ea;
    max-width: 900px;
    margin-bottom: 40px;
  }

  .source-line {
    font-size: 20px;
    color: #1d9bf0;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* ── Footer ── */
  .card-footer {
    padding: 36px 64px;
    border-top: 1px solid #2f3336;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .timestamp {
    font-size: 17px;
    color: #71767b;
  }
  .handle-footer {
    font-size: 17px;
    color: #71767b;
  }
</style>
</head>
<body>
  <div class="profile">
    <div class="avatar"><img src="{{ profile_image_uri | default('', true) }}" alt="DP" /></div>
    <div class="name-block">
      <div class="display-name">Deev Pal <span class="verified">✓</span></div>
      <div class="username">@techycodec08</div>
    </div>
  </div>

  <div class="main-content">
    <div class="headline">{{ headline }}</div>
    <div class="explanation">{{ explanation }}</div>
    {% if source %}<div class="source-line">{{ source }}</div>{% endif %}
  </div>

  <div class="card-footer">
    {% if day_number %}<div class="timestamp">Day {{ day_number }}</div>{% endif %}
    <div class="handle-footer">Security + AI</div>
  </div>
</body>
</html>
