[project]
name = "content-agent"
version = "0.1.0"
description = "Multi-modal content creation agent — Obsidian notes to social media content"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.52.0",
    "openai>=1.30.0",
    "google-genai>=1.10.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "jinja2>=3.1.0",
    "python-frontmatter>=1.1.0",
    "pillow>=10.3.0",
    "playwright>=1.40.0",
    "replicate>=1.0.7",
    "fal-client>=1.0.0",
]

[project.scripts]
content = "content_agent.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
