<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background: {{ colors.primary }};
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: {{ colors.text_light }};
    display: flex;
    flex-direction: column;
    padding: 50px;
    position: relative;
    overflow: hidden;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
  }
  .title {
    font-size: 36px;
    font-weight: 700;
    color: {{ colors.highlight }};
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .badge {
    background: {{ colors.highlight }};
    color: {{ colors.text_light }};
    font-size: 20px;
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 8px;
  }
  .concept-title {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 30px;
    color: #d0d0d0;
  }
  .comparison {
    display: flex;
    gap: 20px;
    flex-grow: 1;
  }
  .side {
    flex: 1;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .side-header {
    padding: 16px 24px;
    font-size: 20px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .vulnerable .side-header {
    background: #ff4757;
    color: #fff;
  }
  .secure .side-header {
    background: #2ed573;
    color: #1a1a2e;
  }
  .side-label {
    padding: 12px 24px;
    font-size: 16px;
    color: #999;
    background: #0d1117;
    border-bottom: 1px solid #30363d;
  }
  .code-area {
    background: #0d1117;
    padding: 24px;
    flex-grow: 1;
    font-family: 'Fira Code', 'JetBrains Mono', monospace;
    font-size: 15px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-all;
    color: #e6edf3;
  }
  .explanation {
    margin-top: 24px;
    padding: 20px 24px;
    background: rgba(233, 69, 96, 0.1);
    border-left: 4px solid {{ colors.highlight }};
    border-radius: 0 8px 8px 0;
    font-size: 20px;
    line-height: 1.5;
    color: #d0d0d0;
  }
  .footer {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    color: #666;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="title">{{ title }}</div>
    {% if day_number %}<div class="badge">DAY {{ day_number }}</div>{% endif %}
  </div>
  <div class="comparison">
    <div class="side vulnerable">
      <div class="side-header">Vulnerable</div>
      <div class="side-label">{{ vulnerable_label }}</div>
      <div class="code-area">{{ vulnerable_code }}</div>
    </div>
    <div class="side secure">
      <div class="side-header">Secure</div>
      <div class="side-label">{{ secure_label }}</div>
      <div class="code-area">{{ secure_code }}</div>
    </div>
  </div>
  {% if explanation %}
  <div class="explanation">{{ explanation }}</div>
  {% endif %}
  <div class="footer">
    <span>Security Learning Journey</span>
    <span>{{ language | upper }}</span>
  </div>
</body>
</html>
